[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".git", "__pycache__", ".pytest_cache", ".pmp_sessions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_return_any = false
check_untyped_defs = true
no_implicit_optional = true
files = [
    "pmp_config.py",
    "rendering.py",
    "core",
    "domain",
    "checks",
    "tools",
    "pipeline",
    "project_agents/claims.py",
    "project_agents/json_output.py",
    "project_agents/llm.py",
    "scripts/check_secrets.py",
]

[[tool.mypy.overrides]]
module = ["agents", "agents.*", "dotenv", "dotenv.*"]
ignore_missing_imports = true
